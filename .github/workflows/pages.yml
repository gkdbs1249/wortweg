name: Deploy WortWeg to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run JavaScript tests
        run: node --test tests/*.test.mjs
      - name: Run Python tests
        run: |
          python3 tests/test_mobile_ui.py
          python3 tests/test_data.py
          python3 tests/test_translate.py
      - name: Build static Pages artifact
        run: |
          mkdir -p _site/src _site/data
          cp index.html styles.css app.mjs firebase-config.mjs manifest.webmanifest sw.js _site/
          cp favicon.ico _site/
          cp -R icons _site/
          cp src/core.mjs src/cloud-sync.mjs src/practice-data.mjs _site/src/
          cp data/words.json _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff385c">
  <meta name="description" content="Goethe A1 시험 대비 독일어 단어 암기와 이틀 간격 복습 웹앱">
  <title>WortWeg · A1 단어 학습</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="홈"><span>W</span> WortWeg</a>
    <div class="topbar-actions">
      <div id="authControls" class="auth-controls">
        <span id="syncStatus" class="sync-status" data-status="local">기기에 저장됨</span>
        <span id="authUser" class="auth-user" hidden></span>
        <button id="googleSignIn" type="button" class="auth-button">Google로 로그인</button>
        <button id="googleSignOut" type="button" class="auth-button secondary" hidden>로그아웃</button>
      </div>
      <button id="menuButton" class="icon-button" aria-label="설정 열기">☰</button>
    </div>
  </header>
  <main id="app" class="shell" aria-live="polite">
    <section class="loading-card"><div class="spinner"></div><p>A1 단어를 불러오는 중…</p></section>
  </main>
  <dialog id="settingsDialog">
    <form method="dialog" class="settings-card">
      <div class="dialog-title"><h2>학습 설정</h2><button class="icon-button" value="cancel" aria-label="닫기">×</button></div>
      <label>하루 신규 단어 수<input id="dailyCountInput" type="number" min="5" max="40" value="20"></label>
      <p class="hint">20개면 9월 26일경 신규 670개를 모두 마치고 시험 전 23일을 복습에 쓸 수 있어요.</p>
      <div class="settings-actions">
        <button id="exportButton" type="button" class="secondary">진도 내보내기</button>
        <label class="secondary file-label">진도 가져오기<input id="importInput" type="file" accept="application/json"></label>
        <button id="resetButton" type="button" class="danger">모든 진도 초기화</button>
      </div>
      <button id="saveSettingsButton" type="button" class="primary full">저장</button>
    </form>
  </dialog>
  <dialog id="dayDetailDialog">
    <div id="dayDetailContent" class="day-detail"></div>
  </dialog>
  <script type="module" src="app.mjs"></script>
</body>
</html>
